# CI for PY-081.
#
# Python 3.9.23 is end-of-life, but from 3.8 onward getting it is no longer
# an ordeal: python-build-standalone covers the version, so `uv python install`
# yields a working interpreter in seconds.
#
# The 3.6 and 3.7 families of this corpus cannot do that -- their CI pulls a
# tarball from the actions/python-versions manifest and then drops Ubuntu
# 20.04's libssl1.1 and libffi7 in beside libpython, because 22.04+ ship
# neither and those CPythons link both. Fifteen lines there, four here. That
# difference is itself a property of the family.
#
# Branch PY_V39_UV_PIP_MONC: 24 tools run on 3.9; 5 remain dark (>=3.10 only).
# A skipped tool exits 3 only when dataset.json records it as inactive.
name: PY-081-MONC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # PyDriller and dulwich need real history

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Provide CPython 3.9.23
        run: |
          set -euo pipefail
          uv python install 3.9.23
          uv python find 3.9 | tee /tmp/pybin
          "$(cat /tmp/pybin)" -V

      - name: Install
        run: |
          ln -sf "Tool Triggering (Synthetic Data)" tools
          "$(cat /tmp/pybin)" -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip==26.0.1"
          .venv/bin/python -m pip install -e . -r requirements-dev.txt
          .venv/bin/python -m pip install -r requirements-runtime.txt

      - name: Install opengrep and Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Test
        run: .venv/bin/python -m pytest -q

      - name: Cross-file consistency audit
        run: .venv/bin/python tools/full_check.py

      - name: Verify tool wiring
        run: .venv/bin/python tools/tool_integration.py --verify

      - name: Run every wired tool
        run: PYTHON=.venv/bin/python .venv/bin/python tools/tool_integration.py --run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-PY-081
          path: reports/
