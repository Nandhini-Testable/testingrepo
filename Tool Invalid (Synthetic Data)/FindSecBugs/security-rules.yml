rules:
  - id: hardcoded-secret
    languages: [java]
    severity: ERROR
    message: Hardcoded credential or secret literal.
    patterns:
      - pattern-either:
          - pattern: String $VAR = "password...";
          - pattern: String $VAR = "secret...";
  - id: weak-hash-algorithm
    languages: [java]
    severity: ERROR
    message: MD5/SHA-1 are not acceptable password or token hash algorithms.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")
  - id: insecure-random
    languages: [java]
    severity: ERROR
    message: java.util.Random is not safe for security-sensitive values; use SecureRandom.
    patterns:
      - pattern: new Random(...)
  - id: non-constant-time-token-compare
    languages: [java]
    severity: ERROR
    message: Comparing secret byte arrays with Arrays.equals/== is not constant-time; use MessageDigest.isEqual.
    patterns:
      - pattern-either:
          - pattern: $A.equals($B)
      - metavariable-regex:
          metavariable: $A
          regex: ".*[Hh]ash.*"
