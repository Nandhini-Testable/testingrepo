rules:
  - id: orderlab-subprocess-shell-true
    pattern: subprocess.$FN(..., shell=True, ...)
    message: subprocess invoked with shell=True
    languages: [python]
    severity: ERROR
  - id: orderlab-eval-call
    pattern: eval(...)
    message: eval() on a caller-supplied expression
    languages: [python]
    severity: ERROR
  - id: orderlab-weak-hash
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: weak hash used for integrity
    languages: [python]
    severity: WARNING
  - id: orderlab-yaml-load
    pattern: yaml.load($X)
    message: yaml.load without a safe loader
    languages: [python]
    severity: ERROR
  - id: orderlab-pickle-loads
    pattern: pickle.loads(...)
    message: pickle deserialisation of untrusted data
    languages: [python]
    severity: ERROR
  - id: orderlab-unverified-ssl
    pattern: ssl._create_unverified_context(...)
    message: TLS certificate verification disabled
    languages: [python]
    severity: ERROR
  - id: orderlab-weak-random-token
    pattern: random.choice(...)
    message: non-cryptographic randomness used for a token
    languages: [python]
    severity: WARNING
  - id: orderlab-world-writable
    pattern: os.chmod($P, 0o777)
    message: file made world-writable
    languages: [python]
    severity: WARNING
