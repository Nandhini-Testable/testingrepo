# Machine-readable trigger for the evaluation harness.
tool: OpenTelemetry (.NET) + OTLP exporter
slug: opentelemetry
kind: sdk
status: not-installed
target_framework: net5.0
language_version: "9.0"
runner: "Tool Triggering (Synthetic Data)/opentelemetry/run.sh"
expects:
  exit_code: 4
  reason: >-
    STATUS CHANGED AT THIS FAMILY, for the same reason as Coverlet: netstandard2.0 clears at net461, so the target framework no longer excludes it and only NuGet does. Note separately that tracing is not path coverage. The TypeScript corpus shipped an OTel bootstrap that registered a no-op processor, exported nothing and exited 0 -- a structurally zero result.
metrics:
  primary_for: 1
  alternative_for: 0

data:
  folder: "Tool Triggering (Synthetic Data)/opentelemetry"
  planted: >-
    span-shaped work with a counter, so an exported zero is distinguishable from a no-op processor
  expected: >-
    a non-zero span count; NOT a path-coverage number
  language_version: "9.0"
  note: >-
    The C# core of this folder's fixtures is C# 5-compatible, so it is identical
    on all 13 families and what the tool measures cannot drift between them. The
    LanguageMarker class in each file is what pins the file to C# 9.0; it does not
    compile under C# 8.0. No project manifest is present, by design.
