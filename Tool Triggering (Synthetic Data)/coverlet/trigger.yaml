# Machine-readable trigger for the evaluation harness.
tool: Coverlet
slug: coverlet
kind: sdk
status: not-installed
target_framework: net6.0
language_version: "10.0"
runner: "Tool Triggering (Synthetic Data)/coverlet/run.sh"
expects:
  exit_code: 4
  reason: >-
    STATUS CHANGED AT THIS FAMILY. net45 and net46 sat below netstandard2.0, whose .NET Framework floor is net461, so Coverlet was excluded by the TARGET FRAMEWORK and exited 3. This family is above that floor: nothing about net462 excludes Coverlet. It is now held out only by NuGet being refused at this host's egress proxy, which is a setup gap -- exit 4. The 18 metrics it is primary for (statement 5, branch 7, delta 6) are dark for a completely different reason than they were one family ago, and collapsing 3 and 4 would hide that.
metrics:
  primary_for: 18
  alternative_for: 0

data:
  folder: "Tool Triggering (Synthetic Data)/coverlet"
  planted: >-
    a branch-dense target where statement and branch coverage genuinely differ
  expected: >-
    a statement-coverage and a branch-coverage number that are not equal
  language_version: "10.0"
  note: >-
    The C# core of this folder's fixtures is C# 5-compatible, so it is identical
    on all 13 families and what the tool measures cannot drift between them. The
    LanguageMarker class in each file is what pins the file to C# 10.0; it does not
    compile under C# 9.0. No project manifest is present, by design.
