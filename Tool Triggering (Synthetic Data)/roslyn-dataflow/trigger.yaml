# Machine-readable trigger for the evaluation harness.
tool: Roslyn SemanticModel.AnalyzeDataFlow
slug: roslyn-dataflow
kind: analyzer
status: not-installed
target_framework: net6.0
language_version: "10.0"
runner: "Tool Triggering (Synthetic Data)/roslyn-dataflow/run.sh"
expects:
  exit_code: 4
  reason: >-
    PROPOSED REPAIR, not in the source sheet. The sheet assigns Data Flow to Stryker.NET, a mutation tester that computes no def-use chains. AnalyzeDataFlow is a real Roslyn API that ships in the SDK and yields genuine def/use sets.
metrics:
  primary_for: 0
  alternative_for: 0

data:
  folder: "Tool Triggering (Synthetic Data)/roslyn-dataflow"
  planted: >-
    a dead store, a cross-branch DU pair, a captured write and a written-never-read local
  expected: >-
    non-trivial AlwaysAssigned / DataFlowsOut / Captured sets per region
  language_version: "10.0"
  note: >-
    The C# core of this folder's fixtures is C# 5-compatible, so it is identical
    on all 13 families and what the tool measures cannot drift between them. The
    LanguageMarker class in each file is what pins the file to C# 10.0; it does not
    compile under C# 9.0. No project manifest is present, by design.
