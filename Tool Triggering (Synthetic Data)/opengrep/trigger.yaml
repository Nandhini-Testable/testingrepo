# Machine-readable trigger for the evaluation harness.
tool: Opengrep
slug: opengrep
kind: standalone
status: not-installed
target_framework: net5.0
language_version: "9.0"
runner: "Tool Triggering (Synthetic Data)/opengrep/run.sh"
expects:
  exit_code: 4
  reason: >-
    Standalone binary, absent from this host. Class B when present. NOTE: the sheet declares 'C# 12+', which inverts the hazard -- a tree-sitter grammar has no language floor, only a construct set, so the risk runs toward NEWER syntax.
metrics:
  primary_for: 0
  alternative_for: 18

data:
  folder: "Tool Triggering (Synthetic Data)/opengrep"
  planted: >-
    the same three planted flows, with this folder's own copy of the rules
  expected: >-
    all 3 rules fire, matching the semgrep folder
  language_version: "9.0"
  note: >-
    The C# core of this folder's fixtures is C# 5-compatible, so it is identical
    on all 13 families and what the tool measures cannot drift between them. The
    LanguageMarker class in each file is what pins the file to C# 9.0; it does not
    compile under C# 8.0. No project manifest is present, by design.
