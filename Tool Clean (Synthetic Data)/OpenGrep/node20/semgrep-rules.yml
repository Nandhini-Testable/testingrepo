# Committed locally because `--config=auto` needs semgrep.dev/opengrep's
# rule registry, which this sandbox's egress allowlist blocks (the same
# constraint the platform's own build-contract docs record for this
# tool). Mirrors the pattern already used for the Python corpus's
# Opengrep/Semgrep folders: a small, real, self-authored ruleset instead
# of a network-fetched one.
rules:
  - id: no-eval
    languages: [javascript]
    message: Avoid eval() -- arbitrary code execution risk.
    severity: ERROR
    pattern: eval(...)
  - id: no-child-process-exec-with-concat
    languages: [javascript]
    message: Avoid building a shell command from string concatenation.
    severity: ERROR
    patterns:
      - pattern: $CP.exec($CMD + ...)
  - id: no-insecure-random-for-tokens
    languages: [javascript]
    message: Use crypto.randomInt/randomBytes, not Math.random(), for security-sensitive values.
    severity: WARNING
    pattern: Math.random()
